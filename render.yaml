services:
  - type: web
    name: exam-seating-system
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        value: mongodb+srv://<db-username>:<db-password>@<cluster-url>/exam_seating?retryWrites=true&w=majority
      - key: SESSION_SECRET
        value: change-this-to-a-random-secret-key
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123
